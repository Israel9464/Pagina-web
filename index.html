<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Curricular Interactiva - Biomedicina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --neutral-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }

        .sidebar h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 1.1rem;
        }

        .sidebar p {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .semestre-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            background: #eff6ff;
            border-radius: 6px;
            padding: 5px 10px;
            margin: 12px 0 6px 0;
        }

        .materia-check {
            display: flex;
            align-items: flex-start;
            padding: 8px 10px;
            margin: 5px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.82rem;
            gap: 8px;
        }

        .materia-check:hover { background: #f0fdf4; border-color: var(--success); }

        .materia-check.checked {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }

        .materia-check input[type="checkbox"],
        .materia-check input[type="radio"] {
            accent-color: var(--success);
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .check-name { flex: 1; line-height: 1.3; }

        .check-cr {
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
            font-weight: 600;
        }

        .materia-check.checked .check-cr { color: #059669; }

        /* Header */
        .malla-header {
            background: white;
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
        }

        .malla-header h2 {
            margin: 0 0 14px 0;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
        }

        .stat-label {
            font-size: 0.72rem;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-value.blue  { color: #2563eb; }
        .stat-value.green { color: #059669; }
        .stat-value.amber { color: #d97706; }
        .stat-value.gray  { color: #475569; }

        .progress-bar-wrap {
            width: 100%;
            background: #e2e8f0;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Malla */
        .malla-canvas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { position: static; max-height: 300px; }
            .malla-canvas { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .semestre-block {
            background: white;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgb(0 0 0 / 0.05);
            border-top: 4px solid var(--primary-light);
        }

        .semestre-block.modulo-block { border-top-color: #8b5cf6; }
        .semestre-block.extra-block  { border-top-color: #f59e0b; }

        .semestre-block h4 {
            margin: 0 0 12px 0;
            color: var(--primary);
            text-align: center;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .semestre-block.modulo-block h4 { color: #6d28d9; }
        .semestre-block.extra-block h4  { color: #b45309; }

        .nodo-materia {
            background: var(--neutral-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nodo-materia.active {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success-text);
            transform: scale(1.02);
            box-shadow: 0 6px 14px -3px rgb(16 185 129 / 0.2);
        }

        .nodo-materia .title {
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            padding-right: 20px;
        }

        .nodo-materia .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #64748b;
        }

        .nodo-materia.active .meta { color: var(--success-text); }

        /* Leyenda de competencia */
        .competencia {
            font-size: 0.68rem;
            line-height: 1.35;
            color: #64748b;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            text-align: justify;
            white-space: pre-line;
        }

        .competencia::before {
            content: "Competencia";
            display: block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #94a3b8;
            margin-bottom: 3px;
        }

        .nodo-materia.active .competencia { color: #047857; border-top-color: #6ee7b7; }
        .nodo-materia.active .competencia::before { color: #059669; }

        .pct-badge {
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 99px;
            padding: 2px 8px;
            font-size: 0.70rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.4s ease;
        }

        .nodo-materia.active .pct-badge {
            background: #065f46;
            color: #d1fae5;
        }

        .cr-bar {
            height: 3px;
            background: #e2e8f0;
            border-radius: 99px;
            margin-top: 6px;
            overflow: hidden;
        }

        .cr-bar-fill {
            height: 100%;
            background: #93c5fd;
            border-radius: 99px;
            transition: background 0.3s;
        }

        .nodo-materia.active .cr-bar-fill { background: #34d399; }

        .status-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.85rem;
            color: var(--success);
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }

        .nodo-materia.active .status-icon { opacity: 1; transform: translateY(0); }
    </style>
</head>

// Calcular créditos del plan nuevo (obligatorias + 2 módulos)
let totalNuevo = 0;
const crPorMateria = {};
let modulosSumados = 0;

for (const [bloque, materias] of Object.entries(estructuraMalla)) {
  const esModulo = bloque.startsWith('Módulo');
  for (const m of materias) {
    const cr = creditosEspeciales[m] !== undefined ? creditosEspeciales[m] : 8;
    const eq = equivalencias.find(x => x.nueva === m);
    crPorMateria[m] = eq ? eq.crNueva : cr;
    if (!esModulo) totalNuevo += crPorMateria[m];
  }
  if (esModulo && modulosSumados < 2) {
    for (const m of materias) totalNuevo += crPorMateria[m];
    modulosSumados++;
  }
}

document.getElementById('cr-total').textContent     = totalNuevo;
document.getElementById('cr-pendientes').textContent = totalNuevo;

//checkboxes agrupados por semestre
const checkList = document.getElementById('check-list');

for (const [semestre, materias] of Object.entries(equivalenciasPorSemestre)) {
  const header = document.createElement('div');
  header.className = 'semestre-header';
  header.textContent = semestre;
  checkList.appendChild(header);

  materias.forEach(eq => {
    const crNueva = eq.nueva
      ? (Array.isArray(eq.nueva)
          ? eq.nueva.reduce((sum, m) => sum + (crPorMateria[m] || 0), 0)
          : (crPorMateria[eq.nueva] || 0))
      : 0;

    const label = document.createElement('label');
    label.className = 'materia-check';
    label.innerHTML = `
      <input type="checkbox"
        data-nueva="${Array.isArray(eq.nueva) ? eq.nueva.join('|') : (eq.nueva || '')}"
        data-cr-ant="${eq.crAnt}"
        data-cr-nueva="${crNueva}">
      <span class="check-name">${eq.antigua}</span>
      <span class="check-cr">${eq.crAnt} CR</span>
    `;
    label.querySelector('input').addEventListener('change', actualizar);
    checkList.appendChild(label);
  });
}

// Malla visual
const mallaVisual = document.getElementById('malla-visual');
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function construirMalla() {
  mallaVisual.innerHTML = '';
  for (const [bloque, materias] of Object.entries(estructuraMalla)) {
    const esModulo = bloque.startsWith('Módulo');
    const esExtra  = bloque === 'Extras';
    const div = document.createElement('div');
    div.className = 'semestre-block' + (esModulo ? ' modulo-block' : '') + (esExtra ? ' extra-block' : '');
    div.innerHTML = `<h4>${bloque}</h4>`;

    materias.forEach(m => {
      const cr  = crPorMateria[m] !== undefined ? crPorMateria[m] : 8;
      const pct = totalNuevo > 0 ? (cr / totalNuevo * 100).toFixed(2) : 0;
      const id  = 'nodo-' + m.replace(/[^a-zA-Z0-9]/g, '');
      const comp = competencias[m];
      const compHtml = comp ? `<div class="competencia">${escapeHtml(comp)}</div>` : '';
      const nodo = document.createElement('div');
      nodo.className = 'nodo-materia';
      nodo.id = id;
      nodo.innerHTML = `
        <i class="fa-solid fa-circle-check status-icon"></i>
        <div class="title">${m}</div>
        <div class="meta">
          <span><i class="fa-solid fa-bookmark"></i> ${cr} CR</span>
          <span class="pct-badge">${pct}% del plan</span>
        </div>
        <div class="cr-bar"><div class="cr-bar-fill" style="width:${pct}%"></div></div>
        ${compHtml}
      `;
      div.appendChild(nodo);
    });

    mallaVisual.appendChild(div);
  }
}

//Función actualizar
function actualizar() {
  document.querySelectorAll('.nodo-materia').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.materia-check').forEach(l => l.classList.remove('checked'));

  let crAnt = 0, crConv = 0;

  // Los 3 proyectos funcionan como UN solo requisito:
  // solo si están los tres marcados se convalidan seminarios, laboratorios y proyecto modular.
  const nombresProyectos = [
    "Proyecto de Instrumentación Médica",
    "Proyecto de Biomecánica Humana",
    "Proyecto de Electrofisiologia"
  ];

  const checkedInputs = [...document.querySelectorAll('#check-list input:checked')];
  const nombreDe = chk => chk.closest('.materia-check').querySelector('.check-name').textContent.trim();
  const checkedNames = checkedInputs.map(nombreDe);
  const tieneTresProyectos = nombresProyectos.every(n => checkedNames.includes(n));

  checkedInputs.forEach(chk => {
    // Los proyectos: SIEMPRE suman sus créditos del plan anterior,
    // pero su convalidación se procesa aparte (solo si están los tres).
    if (nombresProyectos.includes(nombreDe(chk))) {
      crAnt += parseInt(chk.dataset.crAnt) || 0;
      chk.closest('.materia-check').classList.add('checked');
      return;
    }

    const nueva  = chk.dataset.nueva;
    const cAnt   = parseInt(chk.dataset.crAnt) || 0;
    const cNueva = parseInt(chk.dataset.crNueva) || 0;
    crAnt  += cAnt;
    crConv += cNueva;

    const nuevas = nueva ? nueva.split('|') : [];
    nuevas.forEach(n => {
      const id   = 'nodo-' + n.trim().replace(/[^a-zA-Z0-9]/g, '');
      const nodo = document.getElementById(id);
      if (nodo) nodo.classList.add('active');
    });

    chk.closest('.materia-check').classList.add('checked');
  });

  // Proyectos: la CONVALIDACIÓN solo ocurre si están marcados los TRES
  // (el crédito del plan anterior ya se sumó arriba en cualquier caso).
  if (tieneTresProyectos) {
    checkedInputs.forEach(chk => {
      if (!nombresProyectos.includes(nombreDe(chk))) return;

      crConv += parseInt(chk.dataset.crNueva) || 0;

      (chk.dataset.nueva || '').split('|').forEach(n => {
        const id   = 'nodo-' + n.trim().replace(/[^a-zA-Z0-9]/g, '');
        const nodo = document.getElementById(id);
        if (nodo) nodo.classList.add('active');
      });
    });

    // Y se marca también el Proyecto modular
    const nodoProyecto = document.getElementById('nodo-' + 'Proyecto modular'.replace(/[^a-zA-Z0-9]/g, ''));
    if (nodoProyecto) nodoProyecto.classList.add('active');
    crConv += crPorMateria['Proyecto modular'] || 0;
  }

  // Si tiene ambos seminarios de anatomía, marcar Fundamentos de física
  const anatomia1 = checkedNames.includes("Seminario de solución de problemas de Anatomía mecánica I");
  const anatomia2 = checkedNames.includes("Seminario de solución de problemas de Anatomía mecánica II");
  if (anatomia1 && anatomia2) {
    const nodo = document.getElementById('nodo-' + 'Fundamentos de física'.replace(/[^a-zA-Z0-9]/g, ''));
    if (nodo) nodo.classList.add('active');
    crConv += crPorMateria['Fundamentos de física'] || 0;
  }

  const pct = totalNuevo > 0 ? Math.min(crConv / totalNuevo * 100, 100).toFixed(1) : 0;

  document.getElementById('cr-anterior').textContent      = crAnt;
  document.getElementById('cr-convalidados').textContent  = crConv;
  document.getElementById('cr-pendientes').textContent    = Math.max(totalNuevo - crConv, 0);
  document.getElementById('pct-label').textContent        = pct + '%';
  document.getElementById('progress-fill').style.width    = pct + '%';
}

construirMalla();
