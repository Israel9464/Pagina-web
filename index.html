<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Curricular Interactiva - Biomedicina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --neutral-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }

        @media (max-width: 1100px) {
            body {
                padding: 16px;
            }

            .dashboard {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .sidebar {
                position: static;
                max-height: none;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .malla-header {
                padding: 14px;
            }

            .malla-header h2 {
                font-size: 1.15rem;
            }

            .stats-bar {
                width: 100%;
                gap: 8px;
            }

            .stat-pill {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
        }

        .sidebar h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 1.1rem;
        }

        .materia-check {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin: 6px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .materia-check:hover {
            background: #f0fdf4;
            border-color: var(--success);
        }

        .materia-check input {
            margin-right: 10px;
            accent-color: var(--success);
            width: 16px;
            height: 16px;
        }

        .malla-header {
            background: white;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .malla-header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            font-size: 0.88rem;
            background: #eff6ff;
            padding: 6px 15px;
            border-radius: 20px;
            color: var(--primary-light);
            font-weight: bold;
        }

        .stat-pill.green {
            background: #d1fae5;
            color: #065f46;
        }

        /* Barra de progreso global */
        .progress-bar-wrap {
            width: 100%;
            background: #e2e8f0;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .malla-canvas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 1000px) { .malla-canvas { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .malla-canvas { grid-template-columns: 1fr; } }

        .semestre-block {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border-top: 5px solid var(--primary-light);
        }

        .semestre-block h4 {
            margin: 0 0 15px 0;
            color: var(--primary);
            text-align: center;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nodo-materia {
            background: var(--neutral-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .nodo-materia .title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            padding-right: 22px;
        }

        .nodo-materia .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #64748b;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Porcentaje badge */
        .pct-badge {
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 99px;
            padding: 2px 8px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.4s ease;
        }

        .nodo-materia.active .pct-badge {
            background: #065f46;
            color: #d1fae5;
        }

        .nodo-materia.active {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success-text);
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgb(16 185 129 / 0.2);
        }

        .nodo-materia.active .meta {
            color: var(--success-text);
        }

        .status-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.9rem;
            color: var(--success);
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .nodo-materia.active .status-icon {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h3><i class="fa-solid fa-graduation-cap"></i> Plan Anterior Cursado</h3>
        <p style="font-size: 0.8rem; color: #64748b;">Marca las materias que el alumno ya aprobó para ver el impacto visual en el nuevo plan:</p>
        <div id="check-list"></div>
    </div>

    <div>
        <div class="malla-header">
            <h2>Malla Curricular LIB</h2>
            <div class="stats-bar">
                <div class="stat-pill" id="creditos-counter"><i class="fa-solid fa-bookmark"></i> Créditos convalidados: 0</div>
                <div class="stat-pill green" id="pct-counter"><i class="fa-solid fa-fire"></i> Avance del plan: 0%</div>
            </div>
            <div style="width: 100%;">
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="malla-canvas" id="malla-visual"></div>
    </div>
</div>

<script>
const equivalencias = [
  { antigua: "Programación", nueva: "Fundamentos de programación", creditos: 8 },
  { antigua: "Anatomía mecánica II", nueva: "Biomecánica", creditos: 8 },
  { antigua: "Anatomía mecánica I", nueva: "Anatomía", creditos: 8 },
  { antigua: "Métodos matemáticos I", nueva: "Cálculo diferencial e integral", creditos: 8 },
  { antigua: "Métodos matemáticos II", nueva: "Ecuaciones diferenciales", creditos: 8 },
  { antigua: "Instalaciones y seguridad radiológica", nueva: "Legislación y seguridad hospitalaria", creditos: 10 },
  { antigua: "Estadística y procesos estocásticos", nueva: "Estadística experimental", creditos: 8 },
  { antigua: "Instrumentación Diagnóstica y Terapéutica", nueva: "Tecnologías Médicas", creditos: 8 },
  { antigua: "Circuitos eléctricos", nueva: "Circuitos electrónicos", creditos: 8 },
  { antigua: "Acondicionamiento de bioseñales y bioimágenes", nueva: "Señales en sistemas robóticos", creditos: 8 },
  { antigua: "Instrumentación e instalación hospitalaria", nueva: "Instrumentación e instalación hospitalaria", creditos: 8 },
  { antigua: "Procesamiento de bioseñales", nueva: "Procesamiento de bioseñales", creditos: 8 },
  { antigua: "Procesamiento de bioimágenes", nueva: "Procesamiento de bioimágenes", creditos: 8 },
  { antigua: "Instrumentación e instalación quirúrgica", nueva: "Gestión e instrumentación biomédica", creditos: 8 },
  { antigua: "Electrofisiología molecular I", nueva: "Fisiología y fisiopatología", creditos: 10 },
  { antigua: "Electrofisiología molecular II", nueva: "Electrofisiología y neurociencias", creditos: 10 },
  { antigua: "Biosensores y transductores", nueva: "Biosensores y transductores", creditos: 8 },
  { antigua: "Programación de sistemas embebidos", nueva: "Comunicación y control de sistemas embebidos", creditos: 8 },
  { antigua: "Prótesis y órtesis ", nueva: "Prótesis y órtesis", creditos: 8 },
  { antigua: "Análisis del movimiento", nueva: "Análisis del movimiento", creditos: 8 },
  { antigua: "Imagenología médica", nueva: "Conectividad cerebral", creditos: 8 },
  { antigua: "Sistemas electrónicos", nueva: "Microelectrónica", creditos: 8 },
  { antigua: "Instrumentación y técnicas de rehabilitación", nueva: "Rehabilitación", creditos: 8 },
  { antigua: "Dispositivos electrónicos", nueva: "Dispositivos usables y vestibles", creditos: 8 }
];

const estructuraMalla = {
    "Primer Semestre": ["Inducion universitaria","Analisis de problemas globales del siglo XX","Precalculo","Algebra lineal","Fundamentos de fisica","Fundamentos de programación"],
    "Segundo Semestre": ["Legislación y seguridad hospitalaria","Historia de la tecnologia, el arte y la sociedad","Anatomía","Cálculo diferencial e integral","Circuitos electrónicos","Programación estructurada"],
    "Tercer Semestre": ["Instrumentación e instalación hospitalaria", " Ciencia y sustentabilidad", "Biomecánica", "Ecuaciones diferenciales", "Electrónica digital", "Fundamentos de inteligencia artificial"],
    "Cuarto Semestre": ["Procesos y organizacion biologica", "Estadística experimental", "Estructuras de los sistemas biologicos", "Comunicación y control de sistemas embebidos", "Señales en sistemas robóticos"],
    "Quinto Semestre": ["Tecnologías Médicas", "Administración de negocios", "Electrofisiología y neurociencias", "Fisiología y fisiopatología", "Procesamiento de bioseñales", "Procesamiento de bioimágenes"],
    "Sexto Semestre": ["Gestión e instrumentación biomédica", "Biosensores y transductores"],
    "Séptimo Semestre ": ["Tecnología de la información en salud"],
    "Octavo Semestre ": ["Ingeniería clinica", "Innovación tecnologíca y emprendimiento"],
    "Noveno Semestre ": ["Ciencias ómicas","Biomedicina de precisión"],
    "Modulo 1: Biomecanica Y Rehabilitacion": ["Análisis del movimiento", "Prótesis y órtesis", "Rehabilitación"],
    "Modulo 2: Biomateriales": ["Biointegración de materiales", "Regulación de biomateriales", "Diseño de biomateriales"],
    "Modulo 3: Bio-inteligencia Artificial": ["Bases de inteligencia artificial generativa", "Aplicaciones de sistemas biomédicos inteligentes", "Diseño de sistemas biomédicos inteligentes"],
    "Modulo 4: Neuroingeniería": ["Conducta y sistemas cognitivos", "Neuroinstrumentación", "Neuroinformática"],
    "Modulo 5: Neurotecnologia": ["Experencia de usuario", "Conectividad cerebral", "Conectómica"],
    "Modulo 6: Biorobotica": ["Principios biroboticos", "Sistemas bioinspirados", "Robotica suave"],
    "Modulo 7: Dispositivos usables y vestibles": ["Dispositivos microfluídicos", "Microelectrónica", "Dispositivos usables y vestibles"],
    "Modulo 8: Biología Sintética": ["Biología sintética", "Ingenieria de organos y tejidos", "Diseño de organoides"],
    "Modulo 9: Politicas Publicas": ["Liderazgo estratégico en salud", "Ingeniería biomédica y sociedad", "Diseño de políticas públicas"],
    "Modulo 10: Ciencia y Tecnología Emergente": ["Tecnología emergente I", "Tecnología emergente II", "Tecnología emergente III"]
};

// Calcular total de créditos del nuevo plan
let totalCreditosPlan = 0;
const creditosPorMateria = {};
for (const materias of Object.values(estructuraMalla)) {
    for (const materia of materias) {
        const info = equivalencias.find(e => e.nueva === materia);
        const creditos = info ? info.creditos : 8;
        creditosPorMateria[materia] = creditos;
        totalCreditosPlan += creditos;
    }
}

// Panel lateral de checkboxes
const checkListContenedor = document.getElementById('check-list');
equivalencias.forEach((eq) => {
    const label = document.createElement('label');
    label.className = 'materia-check';
    label.innerHTML = `
        <input type="checkbox" data-nueva="${eq.nueva}" data-creditos="${eq.creditos}" onchange="renderizarCambios()">
        <span>${eq.antigua}</span>
    `;
    checkListContenedor.appendChild(label);
});

// Construir malla visual
const mallaVisual = document.getElementById('malla-visual');
function construirMallaVisual() {
    mallaVisual.innerHTML = '';
    for (const [bloque, materias] of Object.entries(estructuraMalla)) {
        const divBloque = document.createElement('div');
        divBloque.className = 'semestre-block';
        divBloque.innerHTML = `<h4>${bloque}</h4>`;

        materias.forEach(materia => {
            const creditos = creditosPorMateria[materia] || 8;
            const pct = ((creditos / totalCreditosPlan) * 100).toFixed(1);
            const safeId = materia.replace(/[^a-zA-Z0-9]/g, '');

            const divNodo = document.createElement('div');
            divNodo.className = 'nodo-materia';
            divNodo.id = `nodo-${safeId}`;
            divNodo.innerHTML = `
                <div class="status-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="title">${materia}</div>
                <div class="meta">
                    <span><i class="fa-solid fa-bookmark"></i> ${creditos} CR</span>
                </div>
            `;
            divBloque.appendChild(divNodo);
        });

        mallaVisual.appendChild(divBloque);
    }
}

function renderizarCambios() {
    document.querySelectorAll('.nodo-materia').forEach(n => n.classList.remove('active'));

    let totalRevalidados = 0;
    document.querySelectorAll('#check-list input:checked').forEach(chk => {
        const nuevaMateria = chk.getAttribute('data-nueva');
        const creditos = parseInt(chk.getAttribute('data-creditos'));
        const safeId = nuevaMateria.replace(/[^a-zA-Z0-9]/g, '');
        const nodo = document.getElementById(`nodo-${safeId}`);
        if (nodo) {
            nodo.classList.add('active');
            totalRevalidados += creditos;
        }
    });

    const pct = ((totalRevalidados / totalCreditosPlan) * 100).toFixed(1);

    document.getElementById('creditos-counter').innerHTML =
        `<i class="fa-solid fa-bookmark"></i> Créditos convalidados: ${totalRevalidados} / ${totalCreditosPlan}`;
    document.getElementById('pct-counter').innerHTML =
        `<i class="fa-solid fa-fire"></i> Avance del plan: ${pct}%`;
    document.getElementById('progress-fill').style.width = `${pct}%`;
}

construirMallaVisual();
</script>
</body>
</html>
